<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marble & Oak — Boutique</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  html { scroll-behavior:smooth; }
  .tight { letter-spacing:-0.022em; }
  .photo { background:#f5f5f7; } .photo img { width:100%; height:100%; object-fit:cover; }
  .reveal { opacity:0; transform:translateY(22px); transition:.7s cubic-bezier(.2,.7,.2,1); } .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}
</style>
</head>
<body class="bg-white text-[#1d1d1f]">
<!-- ↓ EDIT HERE: products, prices, photos ↓ -->
<script>
const CONTENT = {
  name:"Marble & Oak", tagline:"Thoughtful pieces for everyday living.",
  intro:"Objects made to last, chosen with care. Natural materials, quiet design.",
  heroImg:"https://images.unsplash.com/photo-1524758631624-e2822e304c36?q=80&w=1600&auto=format&fit=crop",
  whatsapp:"+62 812 0000 0000", address:"Seminyak, Bali", hours:"Daily · 10am – 9pm",
  products:[
    { name:"Linen Tote", price:"Rp 185.000", img:"https://images.unsplash.com/photo-1544816155-12df9643f363?q=80&w=600&auto=format&fit=crop" },
    { name:"Ceramic Mug Set", price:"Rp 240.000", img:"https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?q=80&w=600&auto=format&fit=crop" },
    { name:"Rattan Lamp", price:"Rp 420.000", img:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?q=80&w=600&auto=format&fit=crop" },
    { name:"Woven Basket", price:"Rp 160.000", img:"https://images.unsplash.com/photo-1606760227091-3dd870d97f1d?q=80&w=600&auto=format&fit=crop" },
    { name:"Scented Candle", price:"Rp 130.000", img:"https://images.unsplash.com/photo-1602874801006-e26c4c5b5c6a?q=80&w=600&auto=format&fit=crop" },
    { name:"Cotton Throw", price:"Rp 295.000", img:"https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?q=80&w=600&auto=format&fit=crop" }
  ]
};
</script>

<header class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-black/[0.06] px-6 md:px-12 h-16 flex items-center justify-between">
  <div class="text-xl font-semibold tight" id="nm"></div>
  <a id="navShop" href="#" class="bg-[#1d1d1f] text-white text-[13px] px-4 py-2 rounded-full hover:opacity-80 transition">Order on WhatsApp</a>
</header>

<!-- HERO -->
<section class="px-6 md:px-12 pt-20 md:pt-28 pb-14 max-w-4xl mx-auto text-center">
  <h1 class="tight text-5xl md:text-7xl font-semibold leading-[1.05] mb-6" id="hn"></h1>
  <p id="htag" class="text-xl md:text-2xl text-[#1d1d1f]/80 font-light max-w-xl mx-auto"></p>
</section>
<section class="px-6 max-w-5xl mx-auto"><div class="photo rounded-[24px] overflow-hidden aspect-[16/9]"><img id="hero" onerror="this.style.display='none'"></div></section>

<section class="px-6 md:px-12 py-24 max-w-2xl mx-auto text-center"><p id="intro" class="reveal tight text-3xl md:text-4xl font-semibold leading-snug"></p></section>

<!-- SHOP -->
<section class="px-6 md:px-12 pb-24 max-w-6xl mx-auto">
  <div class="flex items-baseline justify-between mb-8"><h2 class="tight text-3xl font-semibold">Shop</h2><span class="text-sm text-[#86868b]">Tap to order</span></div>
  <div id="grid" class="grid grid-cols-2 lg:grid-cols-3 gap-5"></div>
</section>

<footer class="border-t border-black/[0.06] px-6 py-10 text-center text-[13px] text-[#86868b]"><span class="font-semibold text-[#1d1d1f]" id="fn"></span> · <span id="fa"></span> · Built by Ficworks</footer>

<script>
  const wa=CONTENT.whatsapp.replace(/[^0-9]/g,''), $=id=>document.getElementById(id);
  const order=p=>"https://wa.me/"+wa+"?text="+encodeURIComponent("Hi "+CONTENT.name+"! I'd like to order: "+(p||""));
  nm.textContent=fn.textContent=hn.textContent=CONTENT.name; htag.textContent=CONTENT.tagline; intro.textContent=CONTENT.intro;
  fa.textContent=CONTENT.address+" · "+CONTENT.hours; hero.src=CONTENT.heroImg; navShop.href=order("");
  grid.innerHTML=CONTENT.products.map(p=>`<a href="${order(p.name)}" target="_blank" class="group block"><div class="photo aspect-square rounded-2xl overflow-hidden mb-3 border border-black/[0.06]"><img src="${p.img}" onerror="this.style.display='none'" class="group-hover:scale-105 transition duration-500"></div><div class="flex items-baseline justify-between px-0.5"><span class="font-medium text-[15px]">${p.name}</span><span class="text-[#1d1d1f]/70 text-[15px]">${p.price}</span></div></a>`).join('');
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.2});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
<!-- Ficworks premium motion -->
<style>
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}.lenis.lenis-stopped{overflow:hidden}
.areveal{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.areveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.areveal{opacity:1!important;transform:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
<script>
(function(){
  if(window.Lenis){var l=new Lenis({duration:1.1,smoothWheel:true});requestAnimationFrame(function raf(t){l.raf(t);requestAnimationFrame(raf);});
    document.querySelectorAll('a[href^="#"]').forEach(function(a){a.addEventListener('click',function(e){var id=a.getAttribute('href');if(id.length>1&&document.querySelector(id)){e.preventDefault();l.scrollTo(id,{offset:-10});}});});}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.1,rootMargin:'0px 0px -5% 0px'});
  document.querySelectorAll('section > *').forEach(function(el){
    if(/\bgrid\b/.test(el.className||'')){Array.prototype.forEach.call(el.children,function(c,i){c.classList.add('areveal');c.style.transitionDelay=Math.min(i*0.07,0.45)+'s';io.observe(c);});}
    else{el.classList.add('areveal');io.observe(el);}
  });
})();
</script>
</body>
</html>
