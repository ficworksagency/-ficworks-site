<script>
  const nav = (navigator.language || "").toLowerCase();
  let lang = nav.startsWith("id") || nav.startsWith("ms") ? "id" : nav.startsWith("km") ? "km" : "en";
  let billing = 'mo';

  function $(id){ return document.getElementById(id); }

  // hover-to-greet: play a character's wave clip on hover if its file exists, else stay on the still
  function playWave(slot){
    const v = slot.querySelector('video.wave');
    if(!v) return;
    v.play().then(() => { v.style.opacity = 1; }).catch(() => {}); // no file → stays hidden, still shows
  }
  function stopWave(slot){
    const v = slot.querySelector('video.wave');
    if(!v) return;
    v.style.opacity = 0; v.pause(); v.currentTime = 0;
  }

  function renderExtras(lang){
    const t = LANG[lang];
    $('navServices').textContent = t.nav.services;
    $('navTeam').textContent = t.nav.team;
    $('navPricing').textContent = t.nav.pricing;

    $('svcH').textContent = t.services.h;
    $('svcSub').textContent = t.services.sub;
    const svcIcons = [
      '<svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M3 12h18M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/></svg>',
      '<svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m21 21-4.3-4.3"/></svg>',
      '<svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 11v2a1 1 0 0 0 1 1h2l9 4V6L6 10H4a1 1 0 0 0-1 1z"/><path stroke-linecap="round" d="M18 8a5 5 0 0 1 0 8"/></svg>',
      '<svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></svg>'
    ];
    $('svcGrid').innerHTML = t.services.groups.map((g, idx) => `
      <button type="button" data-svc="${idx}" class="svc-tile pop text-left w-full rounded-2xl p-7 bg-[#0f1115] border border-white/5 hover:border-[#eab308]/40 transition-all duration-200 hover:shadow-2xl hover:shadow-black/40 group" style="--d:${(idx*0.06).toFixed(2)}s">
        <div class="text-[#eab308] mb-5">${svcIcons[idx] || ''}</div>
        <h3 class="display text-lg font-semibold mb-2">${g.title}</h3>
        <p class="text-sm text-white/45 mb-4">${g.items.length} ${t.services.more}</p>
        <span class="inline-flex items-center gap-1 text-[#eab308] text-sm font-semibold group-hover:gap-2 transition-all">${t.services.see} →</span>
      </button>`).join('');
    window.__svc = t.services.groups;

    $('priceH').textContent = t.pricing.h;
    $('priceSub').textContent = t.pricing.sub;
    $('priceAnchor').textContent = t.pricing.anchor;
    $('priceGuarantee').textContent = t.pricing.guarantee;
    $('priceNote').textContent = t.pricing.note;
    $('priceAddons').textContent = t.pricing.addons;

    $('acH').textContent = t.alacarte.h;
    $('acSub').textContent = t.alacarte.sub;
    $('acHow').textContent = t.alacarte.howLabel;
    $('acSteps').innerHTML = t.alacarte.steps.map(s => `
      <div class="rounded-2xl p-5 bg-[#0f1115] border border-white/5">
        <div class="display text-2xl font-bold text-[#eab308] mb-2">${s.n}</div>
        <h4 class="font-semibold mb-1">${s.t}</h4>
        <p class="text-sm text-white/55 leading-relaxed">${s.d}</p>
      </div>`).join('');
    const acAgents = ["Analyst", "Spy", "Blog Writer", "Marketer", "Marketer", "Researcher"];
    const acUrl = item => lang === 'km' ? ('https://t.me/' + CONTACT.telegram) : ('https://wa.me/' + CONTACT.whatsapp + '?text=' + encodeURIComponent("Hi Ficworks! I'd like: " + item));
    $('acGrid').innerHTML = t.alacarte.items.map((s, i) => `
      <div class="pop rounded-2xl p-6 bg-[#0f1115] border border-white/5 hover:border-white/15 transition-all duration-200 hover:shadow-2xl hover:shadow-black/40 flex flex-col" style="--d:${(i*0.05).toFixed(2)}s">
        <div class="flex items-start justify-between mb-1 gap-2"><h3 class="display text-lg font-semibold">${s.name}</h3><span class="text-[#eab308] text-[10px] uppercase tracking-wider mt-1.5 whitespace-nowrap">${s.note}</span></div>
        <div class="display text-2xl font-bold mb-2">${s.price}</div>
        <p class="text-sm text-white/55 leading-relaxed flex-1 mb-3">${s.desc}</p>
        <div class="text-xs text-white/35 mb-4">${t.alacarte.by} <span class="text-white/60">${acAgents[i]}</span></div>
        <a href="${acUrl(s.name)}" target="_blank" class="block text-center bg-white/10 hover:bg-white/20 text-white rounded-full py-2.5 text-sm font-semibold transition">${t.alacarte.cta}</a>
      </div>`).join('');

    $('acPay').textContent = t.alacarte.pay;

    $('whyH').textContent = t.why.h;
    $('whySub').textContent = t.why.sub;
    const whyIcons = [
      '<svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></svg>',
      '<svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><circle cx="9" cy="8" r="3"/><path stroke-linecap="round" stroke-linejoin="round" d="M3.5 20a5.5 5.5 0 0 1 11 0M16 5.5a3 3 0 0 1 0 5M20.5 20a5.5 5.5 0 0 0-3-4.9"/></svg>',
      '<svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 17l6-6 4 4 8-8M21 9V5h-4"/></svg>'
    ];
    $('whyGrid').innerHTML = t.why.items.map((w, i) => `
      <div class="rounded-2xl p-6 bg-[#0f1115] border border-white/5">
        <div class="text-[#eab308] mb-4">${whyIcons[i] || ''}</div>
        <h3 class="display text-lg font-semibold mb-2">${w.t}</h3>
        <p class="text-sm text-white/55 leading-relaxed">${w.d}</p>
      </div>`).join('');
    $('billMo').textContent = t.pricing.monthly;
    $('billYr').textContent = t.pricing.annual + ' · ' + t.pricing.save;
    $('billMo').style.background = billing === 'mo' ? '#fff' : 'transparent';
    $('billMo').style.color = billing === 'mo' ? '#0c1117' : '#fff';
    $('billYr').style.background = billing === 'yr' ? '#fff' : 'transparent';
    $('billYr').style.color = billing === 'yr' ? '#0c1117' : '#fff';
    $('priceGrid').innerHTML = t.pricing.tiers.map((p, i) => {
      const pop = !!p.popular, isCustom = !!p.custom;
      const priceBlock = isCustom
        ? `<div class="mb-1"><span class="display text-3xl font-bold">${t.pricing.customPrice}</span></div><div class="text-xs text-white/40 mb-4">&nbsp;</div>`
        : `<div class="mb-1"><span class="display text-4xl font-bold">${billing === 'yr' ? p.yr : p.mo}</span><span class="text-white/50">${t.pricing.perMo}</span></div>
           <div class="text-xs ${billing === 'yr' ? 'text-[#34d399]' : 'text-white/40'} mb-4">${billing === 'yr' ? t.pricing.setupWaived : t.pricing.setupPrefix + ' ' + p.setupFee}</div>`;
      return `<div class="pop rounded-3xl p-6 bg-[#0f1115] border ${pop ? 'border-[#eab308] glow' : 'border-white/10'} relative flex flex-col transition-all duration-200" style="--c:#eab308;--d:${(i*0.06).toFixed(2)}s">
        ${pop ? `<div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-[#eab308] text-[#0c1117] text-xs font-semibold px-3 py-1 rounded-full whitespace-nowrap">${t.pricing.popular}</div>` : ''}
        <h3 class="display text-xl font-bold mb-1">${p.name}</h3>
        <p class="text-white/50 text-sm mb-4">${p.tagline}</p>
        ${priceBlock}
        <ul class="space-y-2 mb-6 text-sm text-white/70 flex-1">${p.features.map(f => `<li class="flex gap-2"><span class="text-[#34d399] shrink-0">✓</span> ${f}</li>`).join('')}</ul>
        <a href="#contact" class="block text-center ${pop ? 'bg-[#eab308] text-[#0c1117]' : 'bg-white/10 text-white'} rounded-full py-3 font-semibold hover:opacity-90 transition">${isCustom ? t.pricing.customCta : t.pricing.cta}</a>
      </div>`;
    }).join('');

    $('faqH').textContent = t.faq.h;
    $('faqList').innerHTML = t.faq.items.map(f => `
      <details class="group rounded-2xl bg-[#0f1115] border border-white/5 p-5">
        <summary class="cursor-pointer font-medium list-none flex justify-between items-center gap-4">${f.q}<span class="text-white/40 group-open:rotate-45 transition shrink-0">+</span></summary>
        <p class="text-sm text-white/55 mt-3 leading-relaxed">${f.a}</p>
      </details>`).join('');

    $('fName').placeholder = t.form.name;
    $('fBiz').placeholder = t.form.biz;
    $('fCity').placeholder = t.form.city;
    $('fSubmit').textContent = t.form.submit;
    $('finalOr').textContent = t.form.or;

    $('navExamples').textContent = t.nav.examples;
    $('exH').textContent = t.examples.h;
    $('exSub').textContent = t.examples.sub;
    $('exGrid').innerHTML = EXAMPLES.map((e, idx) => `
      <a href="${e.link}" target="_blank" class="pop group relative block rounded-2xl overflow-hidden aspect-[4/3] bg-[#0f1115] transition-all duration-300 hover:shadow-2xl hover:shadow-black/50" style="--d:${(idx*0.06).toFixed(2)}s">
        <img src="${e.img}" alt="${e.name}" onerror="this.style.display='none'" class="absolute inset-0 w-full h-full object-cover group-hover:scale-[1.06] transition duration-700">
        <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/25 to-transparent"></div>
        <div class="absolute inset-x-0 bottom-0 p-5 flex items-end justify-between gap-3">
          <div>
            <div class="text-[11px] uppercase tracking-[0.2em] text-[#eab308] mb-1.5">${t.examples.types[e.key]}</div>
            <div class="display text-xl font-semibold text-white tracking-tight">${e.name}</div>
          </div>
          <span class="text-sm text-white/70 group-hover:text-white group-hover:translate-x-0.5 transition whitespace-nowrap pb-0.5">${t.examples.view} →</span>
        </div>
      </a>`).join('');

    $('trustGrid').innerHTML = t.trust.map(x => `<div class="rounded-2xl p-5 bg-[#0f1115] border border-white/5"><div class="font-semibold text-sm mb-1 tracking-tight">${x.t}</div><div class="text-xs text-white/55 leading-relaxed">${x.d}</div></div>`).join('');
  }

  function renderLang() {
    const t = LANG[lang];
    $('agName').textContent = AGENCY_NAME;
    $('footName').textContent = AGENCY_NAME;
    $('navCta').textContent = t.cta_nav;
    $('heroEyebrow').textContent = t.hero_eyebrow;
    $('heroH').textContent = t.hero_h;
    $('heroSub').textContent = t.hero_sub;
    $('heroCtaA').textContent = t.cta_nav;
    $('gapEyebrow').textContent = t.gap_eyebrow;
    $('gapH').textContent = t.gap_h;
    $('gapSub').textContent = t.gap_sub;
    $('withoutH').textContent = t.without_h;
    $('withH').textContent = t.with_h;
    $('gapFoot').textContent = t.gap_foot;
    $('teamH').textContent = t.team_h;
    $('teamSub').textContent = t.team_sub;
    $('statsGrid').innerHTML = t.stats.map(s => `<div><div class="display text-4xl md:text-5xl font-bold text-[#eab308]"><span class="statnum" data-to="${s.n}" data-suf="${s.s}">${s.n}${s.s}</span></div><div class="text-sm text-white/50 mt-2">${s.l}</div></div>`).join('');
    // case study section removed for now — re-add when a real client is live
    $('finalH').textContent = t.final_h;
    $('finalSub').textContent = t.final_sub;
    $('finalBtn').textContent = t.final_btn;
    const useTelegram = (lang === 'km');   // Cambodia → Telegram, everyone else → WhatsApp
    $('finalBtn').href = useTelegram ? ("https://t.me/" + CONTACT.telegram) : ("https://wa.me/" + CONTACT.whatsapp);
    $('finalBtn').style.backgroundColor = useTelegram ? "#229ED9" : "#25D366";
    $('footText').textContent = t.footer;
    document.documentElement.lang = lang;

    $('withoutList').innerHTML = t.without.map(x => `<li class="flex gap-3"><span class="text-[#f43f5e]">✕</span> ${x}</li>`).join('');
    $('withList').innerHTML    = t.with.map(x => `<li class="flex gap-3"><span class="text-[#34d399]">✓</span> ${x}</li>`).join('');

    $('agentGrid').innerHTML = VISUAL.agents.map((a,i) => `
      <div class="agent-card snap-start shrink-0 w-[280px] sm:w-[320px] rounded-3xl p-6 bg-[#0f1115] border border-white/5 hover:border-white/15 hover:shadow-2xl hover:shadow-black/40 transition-all duration-200" style="--c:${a.c};--d:${(i*0.12).toFixed(2)}s">
        <div class="slot rounded-2xl aspect-square mb-5 glow" style="--c:${a.c}" onmouseenter="playWave(this)" onmouseleave="stopWave(this)">
          <img class="charimg" style="--delay:${(i*0.45).toFixed(2)}s;--dur:${(3.6+(i%3)*0.7).toFixed(2)}s" src="${a.img}" alt="${a.name}" onerror="this.style.display='none'" />
          <video class="wave" muted loop playsinline preload="none" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:3;opacity:0;transition:opacity .25s"><source src="${a.img.replace('.png','-wave.mp4')}" type="video/mp4"></video>
          <div class="ph">${a.emoji}</div>
        </div>
        <div class="text-xs uppercase tracking-wider mb-1" style="color:${a.c}">${t.roles[i].r}</div>
        <h3 class="display text-xl font-semibold mb-2">${a.name}</h3>
        <p class="text-sm text-white/55 leading-relaxed">${t.roles[i].d}</p>
      </div>`).join('');

    $('stepsGrid').innerHTML = t.steps.map((s,i) => `
      <div><div class="display text-4xl font-bold text-[#eab308] mb-3">${i+1}</div>
      <h3 class="display font-semibold mb-2">${s.t}</h3>
      <p class="text-sm text-white/55">${s.d}</p></div>`).join('');

    document.querySelectorAll('.langbtn').forEach(b => b.classList.toggle('active', b.dataset.l === lang));

    renderExtras(lang);
    renderBot();
    observeReveal();
  }

  $('langSwitch').innerHTML = Object.keys(LANG).map(code =>
    `<button class="langbtn px-2 py-1 hover:opacity-100" data-l="${code}">${LANG[code].label}</button>`).join('<span class="text-white/20">|</span>');
  $('langSwitch').addEventListener('click', e => {
    if (e.target.dataset.l) { lang = e.target.dataset.l; renderLang(); }
  });

  $('billMo').addEventListener('click', () => { billing = 'mo'; renderExtras(lang); observeReveal(); });
  $('billYr').addEventListener('click', () => { billing = 'yr'; renderExtras(lang); observeReveal(); });

  function requestDemo(e){
    e.preventDefault();
    const msg = "Hi Ficworks! I'd like a free website demo.\n• Business: " + $('fName').value.trim() + "\n• Type: " + $('fBiz').value.trim() + "\n• Location: " + $('fCity').value.trim();
    if (lang === 'km') window.open('https://t.me/' + CONTACT.telegram, '_blank');
    else window.open('https://wa.me/' + CONTACT.whatsapp + '?text=' + encodeURIComponent(msg), '_blank');
  }
  $('demoForm').addEventListener('submit', requestDemo);

  // support chat widget
  function appendMsg(html, who){
    const d = document.createElement('div');
    d.className = who === 'user' ? 'text-right' : '';
    d.innerHTML = '<span class="inline-block ' + (who === 'user' ? 'bg-[#eab308] text-[#0c1117]' : 'bg-[#1a2530] text-white/90') + ' rounded-2xl px-3 py-2 max-w-[85%]">' + html + '</span>';
    $('chatBody').appendChild(d); $('chatBody').scrollTop = $('chatBody').scrollHeight;
  }
  function renderBot(){
    const t = LANG[lang].bot;
    $('chatTitle').textContent = t.title;
    $('chatBody').innerHTML = '';
    appendMsg(t.greeting, 'bot');
    $('chatChips').innerHTML = Object.keys(t.chips).map(k => '<button class="chip bg-[#1a2530] hover:bg-[#22303d] border border-white/10 rounded-full px-3 py-1.5 text-xs transition" data-k="' + k + '">' + t.chips[k] + '</button>').join('');
  }
  $('chatBubble').addEventListener('click', () => { $('chatPanel').classList.toggle('chat-open'); });
  $('chatClose').addEventListener('click', () => { $('chatPanel').classList.remove('chat-open'); });
  $('chatChips').addEventListener('click', e => {
    const k = e.target.dataset.k; if (!k) return;
    const t = LANG[lang].bot;
    appendMsg(t.chips[k], 'user');
    setTimeout(() => {
      appendMsg(t.answers[k], 'bot');
      if (k === 'human') {
        const url = lang === 'km' ? 'https://t.me/' + CONTACT.telegram : 'https://wa.me/' + CONTACT.whatsapp;
        appendMsg('<a href="' + url + '" target="_blank" class="underline text-[#34d399]">' + t.humanBtn + ' →</a>', 'bot');
      }
    }, 300);
  });

  const revealObs = ('IntersectionObserver' in window) ? new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); revealObs.unobserve(e.target); } });
  }, { threshold: 0.08, rootMargin: '0px 0px -8% 0px' }) : null;
  function observeReveal(){
    const els = document.querySelectorAll('.pop:not(.in), .agent-card:not(.in)');
    if (revealObs) els.forEach(c => revealObs.observe(c)); else els.forEach(c => c.classList.add('in'));
  }
  renderLang();
</script>

<!-- ============ PREMIUM MOTION LAYER ============ -->
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
<script>
(function(){
  const bar = document.getElementById('scroll-progress');
  function progress(){ const h=document.documentElement; const max=h.scrollHeight-h.clientHeight; const y=window.scrollY||h.scrollTop; if(bar) bar.style.width=(max>0?(y/max*100):0)+'%'; }

  // Smooth scrolling (Lenis) with graceful fallback
  if (window.Lenis){
    const lenis = new Lenis({ duration:1.15, smoothWheel:true });
    function raf(t){ lenis.raf(t); requestAnimationFrame(raf); } requestAnimationFrame(raf);
    lenis.on('scroll', progress);
    document.querySelectorAll('a[href^="#"]').forEach(a=>{
      a.addEventListener('click', e=>{ const id=a.getAttribute('href'); if(id.length>1 && document.querySelector(id)){ e.preventDefault(); lenis.scrollTo(id,{offset:-10}); } });
    });
  }
  window.addEventListener('scroll', progress, {passive:true}); progress();

  // Cursor spotlight (desktop only)
  const glow=document.getElementById('cursor-glow');
  if (glow && matchMedia('(hover:hover) and (pointer:fine)').matches){
    window.addEventListener('mousemove', e=>{ glow.classList.add('on'); glow.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)'; }, {passive:true});
    document.addEventListener('mouseleave', ()=> glow.classList.remove('on'));
  }

  // Magnetic buttons
  document.querySelectorAll('[data-magnetic]').forEach(b=>{
    b.style.transition='transform .25s cubic-bezier(.2,.8,.2,1)';
    b.addEventListener('mousemove', e=>{ const r=b.getBoundingClientRect(); b.style.transform='translate('+(e.clientX-r.left-r.width/2)*0.3+'px,'+(e.clientY-r.top-r.height/2)*0.45+'px)'; });
    b.addEventListener('mouseleave', ()=> b.style.transform='');
  });

  // Custom cursor — dot follows instantly, ring lags + grows over interactive elements
  const dot=document.getElementById('cdot'), ring=document.getElementById('cring');
  if (dot && ring && matchMedia('(hover:hover) and (pointer:fine)').matches){
    let rx=innerWidth/2, ry=innerHeight/2, mx=rx, my=ry;
    window.addEventListener('mousemove', e=>{ mx=e.clientX; my=e.clientY; dot.style.transform='translate('+mx+'px,'+my+'px)'; }, {passive:true});
    (function ringRaf(){ rx+=(mx-rx)*0.2; ry+=(my-ry)*0.2; ring.style.transform='translate('+rx+'px,'+ry+'px)'; requestAnimationFrame(ringRaf); })();
    document.querySelectorAll('a,button,[data-magnetic],.langbtn,input,textarea').forEach(el=>{
      el.addEventListener('mouseenter', ()=> ring.classList.add('hot'));
      el.addEventListener('mouseleave', ()=> ring.classList.remove('hot'));
    });
  }

  // Count-up stats when they scroll into view
  const stnums=document.querySelectorAll('.statnum');
  if (stnums.length){
    const sio=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ const el=e.target, to=+el.dataset.to, suf=el.dataset.suf||'', st=performance.now();
      (function tick(now){ const p=Math.min((now-st)/1200,1); el.textContent=Math.round(to*(1-Math.pow(1-p,3)))+suf; if(p<1) requestAnimationFrame(tick); })(performance.now());
      sio.unobserve(el); } }),{threshold:.4});
    stnums.forEach(el=>sio.observe(el));
  }

  // Detail popups (team, etc.)
  const openModal = id => { const m=document.getElementById(id); if(m){ m.classList.add('open'); m.querySelectorAll('.agent-card,.pop').forEach(c=>c.classList.add('in')); document.body.style.overflow='hidden'; } };
  const closeModals = () => { document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open')); document.body.style.overflow=''; };
  const to=document.getElementById('teamOpen'); if(to) to.addEventListener('click',()=>openModal('teamModal'));
  document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click', closeModals));
  const detailBody=document.getElementById('detailBody'), svcGridEl=document.getElementById('svcGrid');
  if (svcGridEl && detailBody) svcGridEl.addEventListener('click', e=>{
    const tile=e.target.closest('.svc-tile'); if(!tile) return;
    const g=(window.__svc||[])[+tile.dataset.svc]; if(!g) return;
    detailBody.innerHTML='<h3 class="display text-3xl md:text-4xl font-bold tracking-tight text-center mb-8">'+g.title+'</h3><ul class="space-y-4 text-white/70 max-w-xl mx-auto">'+g.items.map(function(i){return '<li class="flex gap-3"><svg class="w-5 h-5 mt-0.5 shrink-0 text-[#34d399]" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m5 13 4 4L19 7"/></svg><span>'+i+'</span></li>';}).join('')+'</ul>';
    openModal('detailModal');
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModals(); });

  // Team horizontal slide — drag + mouse-wheel + native swipe
  const strip=document.getElementById('agentGrid');
  if (strip){
    let down=false,sx=0,sl=0;
    strip.addEventListener('mousedown', e=>{ down=true; sx=e.pageX; sl=strip.scrollLeft; strip.classList.add('grabbing'); });
    window.addEventListener('mouseup', ()=>{ down=false; strip.classList.remove('grabbing'); });
    strip.addEventListener('mousemove', e=>{ if(!down) return; e.preventDefault(); strip.scrollLeft=sl-(e.pageX-sx); });
    strip.addEventListener('wheel', e=>{ if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ strip.scrollLeft += e.deltaY; e.preventDefault(); } }, {passive:false});
  }
})();
</script>
</body>
