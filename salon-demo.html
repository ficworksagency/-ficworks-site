<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Velour — Hair & Beauty</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  html { scroll-behavior:smooth; }
  .tight { letter-spacing:-0.022em; }
  .photo { background:#f5f5f7; } .photo img { width:100%; height:100%; object-fit:cover; }
  .prodshadow { box-shadow: rgba(0,0,0,0.18) 2px 6px 34px; }
  .reveal { opacity:0; transform:translateY(22px); transition:.7s cubic-bezier(.2,.7,.2,1); } .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}
</style>
</head>
<body class="bg-white text-[#1d1d1f]">
<!-- ↓ EDIT HERE: services, prices, hours ↓ -->
<script>
const CONTENT = {
  name:"Velour", sub:"Hair & Beauty",
  tagline:"Walk in. Glow out.",
  intro:"A quiet studio in the city for hair, nails and skin. Unhurried, considered, yours.",
  heroImg:"https://images.unsplash.com/photo-1560066984-138dadb4c035?q=80&w=1600&auto=format&fit=crop",
  whatsapp:"+60 12 000 0000", address:"Lot 5, Bukit Bintang, Kuala Lumpur", hours:"Tue – Sun · 10am – 8pm",
  services:[
    { cat:"Hair", items:[["Cut & Style","RM 65"],["Colour / Highlights","from RM 180"],["Keratin Treatment","RM 250"],["Blow-dry","RM 45"]] },
    { cat:"Nails & Skin", items:[["Manicure","RM 50"],["Gel Nails","RM 80"],["Signature Facial","RM 120"],["Lash Lift","RM 90"]] }
  ]
};
</script>

<header class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-black/[0.06] px-6 md:px-12 h-16 flex items-center justify-between">
  <div class="text-xl font-semibold tight" id="nm"></div>
  <nav class="hidden md:flex gap-8 text-[13px] text-[#1d1d1f]/70"><a href="#services" class="hover:text-black transition">Services</a><a href="#visit" class="hover:text-black transition">Visit</a></nav>
  <a id="navBook" href="#" class="bg-[#1d1d1f] text-white text-[13px] px-4 py-2 rounded-full hover:opacity-80 transition">Book</a>
</header>

<!-- HERO -->
<section class="px-6 md:px-12 pt-20 md:pt-28 pb-16 max-w-4xl mx-auto text-center">
  <h1 class="tight text-5xl md:text-7xl font-semibold leading-[1.05] mb-6"><span id="hn"></span> <span class="text-[#86868b]" id="hs"></span></h1>
  <p id="htag" class="text-xl md:text-2xl text-[#1d1d1f]/80 font-light"></p>
</section>
<section class="px-6 max-w-5xl mx-auto"><div class="photo rounded-[24px] overflow-hidden aspect-[16/9]"><img id="hero" onerror="this.style.display='none'"></div></section>

<!-- INTRO -->
<section class="px-6 md:px-12 py-24 max-w-2xl mx-auto text-center">
  <p id="intro" class="reveal tight text-3xl md:text-4xl font-semibold leading-snug"></p>
</section>

<!-- SERVICES -->
<section id="services" class="px-6 md:px-12 py-20 bg-[#f5f5f7]">
  <div class="max-w-3xl mx-auto">
    <h2 class="tight text-3xl md:text-4xl font-semibold mb-12 text-center">Services</h2>
    <div id="list" class="space-y-12"></div>
    <p class="text-center text-sm text-[#86868b] mt-12">Tap a service to book on WhatsApp.</p>
  </div>
</section>

<!-- VISIT -->
<section id="visit" class="px-6 md:px-12 py-28 max-w-2xl mx-auto text-center">
  <h2 class="tight text-4xl md:text-5xl font-semibold mb-6">Come in.</h2>
  <p id="addr" class="text-lg text-[#1d1d1f]/80"></p><p id="hrs" class="text-[#86868b] mt-1 mb-10"></p>
  <a id="book" href="#" class="inline-block bg-[#1d1d1f] text-white px-8 py-3.5 rounded-full hover:opacity-80 transition"></a>
</section>

<footer class="border-t border-black/[0.06] px-6 py-10 text-center text-[13px] text-[#86868b]"><span class="font-semibold text-[#1d1d1f]" id="fn"></span> · Built by Ficworks</footer>

<script>
  const wa=CONTENT.whatsapp.replace(/[^0-9]/g,''), $=id=>document.getElementById(id);
  const book=s=>"https://wa.me/"+wa+"?text="+encodeURIComponent("Hi "+CONTENT.name+"! I'd like to book: "+(s||""));
  nm.textContent=fn.textContent=hn.textContent=CONTENT.name; hs.textContent=CONTENT.sub; htag.textContent=CONTENT.tagline; intro.textContent=CONTENT.intro;
  addr.textContent=CONTENT.address; hrs.textContent=CONTENT.hours; hero.src=CONTENT.heroImg;
  navBook.href=book(""); book.href=book(""); book.textContent="Book on WhatsApp";
  list.innerHTML=CONTENT.services.map(g=>`<div><h3 class="text-sm uppercase tracking-widest text-[#86868b] mb-5">${g.cat}</h3>${g.items.map(it=>`<a href="${book(it[0])}" target="_blank" class="flex items-baseline justify-between py-3.5 border-b border-black/[0.07] group"><span class="text-lg group-hover:text-[#86868b] transition">${it[0]}</span><span class="text-[#1d1d1f]/70">${it[1]}</span></a>`).join('')}</div>`).join('');
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.2});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
<!-- Ficworks premium motion -->
<style>
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}.lenis.lenis-stopped{overflow:hidden}
.areveal{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.areveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.areveal{opacity:1!important;transform:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
<script>
(function(){
  if(window.Lenis){var l=new Lenis({duration:1.1,smoothWheel:true});requestAnimationFrame(function raf(t){l.raf(t);requestAnimationFrame(raf);});
    document.querySelectorAll('a[href^="#"]').forEach(function(a){a.addEventListener('click',function(e){var id=a.getAttribute('href');if(id.length>1&&document.querySelector(id)){e.preventDefault();l.scrollTo(id,{offset:-10});}});});}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.1,rootMargin:'0px 0px -5% 0px'});
  document.querySelectorAll('section > *').forEach(function(el){
    if(/\bgrid\b/.test(el.className||'')){Array.prototype.forEach.call(el.children,function(c,i){c.classList.add('areveal');c.style.transitionDelay=Math.min(i*0.07,0.45)+'s';io.observe(c);});}
    else{el.classList.add('areveal');io.observe(el);}
  });
})();
</script>
</body>
</html>
