<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BrightSmile — Dental Clinic</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  html { scroll-behavior:smooth; }
  .tight { letter-spacing:-0.022em; }
  .photo { background:#f5f5f7; } .photo img { width:100%; height:100%; object-fit:cover; }
  .reveal { opacity:0; transform:translateY(22px); transition:.7s cubic-bezier(.2,.7,.2,1); } .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}
</style>
</head>
<body class="bg-white text-[#1d1d1f]">
<!-- ↓ EDIT HERE: services, prices, hours ↓ -->
<script>
const CONTENT = {
  name:"BrightSmile", sub:"Dental Clinic",
  tagline:"Gentle, modern dental care for the whole family.",
  heroImg:"https://images.unsplash.com/photo-1629909613654-28e377c37b09?q=80&w=1600&auto=format&fit=crop",
  whatsapp:"+62 812 0000 0000", address:"Jl. Sudirman No.8, Surabaya", hours:"Mon – Sat · 9am – 6pm",
  stats:[["12k+","Happy patients"],["15","Years of care"],["4.9★","Google rating"]],
  services:[
    ["Check-up & Clean","Rp 250.000","Exam, scaling and polish."],
    ["Teeth Whitening","Rp 1.200.000","A brighter smile in one visit."],
    ["Fillings","from Rp 350.000","Tooth-coloured and painless."],
    ["Braces Consult","Free","Plan your perfect smile."],
    ["Root Canal","from Rp 1.500.000","Save your natural tooth."],
    ["Kids Dentistry","Rp 200.000","Friendly care for little ones."]
  ]
};
</script>

<header class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-black/[0.06] px-6 md:px-12 h-16 flex items-center justify-between">
  <div class="text-xl font-semibold tight" id="nm"></div>
  <nav class="hidden md:flex gap-8 text-[13px] text-[#1d1d1f]/70"><a href="#services" class="hover:text-black transition">Services</a><a href="#book" class="hover:text-black transition">Contact</a></nav>
  <a id="navBook" href="#" class="bg-[#0066cc] text-white text-[13px] px-4 py-2 rounded-full hover:bg-[#0058b0] transition">Book</a>
</header>

<!-- HERO -->
<section class="px-6 md:px-12 pt-20 md:pt-28 pb-14 max-w-4xl mx-auto text-center">
  <h1 class="tight text-5xl md:text-7xl font-semibold leading-[1.05] mb-6"><span id="hn"></span></h1>
  <p id="htag" class="text-xl md:text-2xl text-[#1d1d1f]/75 font-light max-w-2xl mx-auto mb-9"></p>
  <a id="hcta" href="#" class="inline-block bg-[#0066cc] text-white px-8 py-3.5 rounded-full hover:bg-[#0058b0] transition">Book an appointment</a>
</section>
<section class="px-6 max-w-5xl mx-auto"><div class="photo rounded-[24px] overflow-hidden aspect-[16/9]"><img id="hero" onerror="this.style.display='none'"></div></section>

<!-- STATS -->
<section class="px-6 md:px-12 py-20 max-w-4xl mx-auto"><div id="stats" class="grid grid-cols-3 gap-6 text-center reveal"></div></section>

<!-- SERVICES -->
<section id="services" class="px-6 md:px-12 py-16 bg-[#f5f5f7]">
  <div class="max-w-5xl mx-auto">
    <h2 class="tight text-3xl md:text-4xl font-semibold mb-3 text-center">Our services</h2>
    <p class="text-center text-[#86868b] mb-12 text-sm">Tap a service to book on WhatsApp.</p>
    <div id="svcGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </div>
</section>

<!-- BOOK -->
<section id="book" class="px-6 md:px-12 py-28 max-w-2xl mx-auto text-center">
  <h2 class="tight text-4xl md:text-5xl font-semibold mb-5">Healthy teeth start here.</h2>
  <p id="info" class="text-[#86868b] mb-10"></p>
  <a id="book2" href="#" class="inline-block bg-[#0066cc] text-white px-9 py-4 rounded-full hover:bg-[#0058b0] transition"></a>
</section>

<footer class="border-t border-black/[0.06] px-6 py-10 text-center text-[13px] text-[#86868b]"><span class="font-semibold text-[#1d1d1f]" id="fn"></span> · Built by Ficworks</footer>

<script>
  const wa=CONTENT.whatsapp.replace(/[^0-9]/g,''), $=id=>document.getElementById(id);
  const bk=s=>"https://wa.me/"+wa+"?text="+encodeURIComponent("Hi "+CONTENT.name+"! I'd like to book: "+(s||"an appointment"));
  nm.textContent=fn.textContent=CONTENT.name; hn.textContent=CONTENT.name+" "+CONTENT.sub; htag.textContent=CONTENT.tagline;
  info.textContent=CONTENT.address+" · "+CONTENT.hours; hero.src=CONTENT.heroImg;
  navBook.href=$('hcta').href=bk(""); const b2=$('book2'); b2.href=bk(""); b2.textContent="Book on WhatsApp";
  $('stats').innerHTML=CONTENT.stats.map(s=>`<div><div class="tight text-3xl md:text-4xl font-semibold text-[#0066cc]">${s[0]}</div><div class="text-sm text-[#86868b] mt-1">${s[1]}</div></div>`).join('');
  $('svcGrid').innerHTML=CONTENT.services.map(s=>`<a href="${bk(s[0])}" target="_blank" class="block bg-white rounded-[18px] border border-[#e0e0e0] p-6 hover:border-[#0066cc] transition"><div class="flex items-baseline justify-between mb-1.5"><h3 class="font-semibold tight">${s[0]}</h3><span class="text-[#0066cc] font-semibold text-sm whitespace-nowrap">${s[1]}</span></div><p class="text-sm text-[#86868b]">${s[2]}</p></a>`).join('');
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.2});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
</body>
</html>
